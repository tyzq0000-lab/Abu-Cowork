# 盯上游 abu-cowork 的**提交漂移**，落后就开/刷新一个常驻 issue。
# 合并仍然手动 —— 冲突处理手册见 UPSTREAM-SYNC.md。
#
# 🔴 为什么是"提交"不是"release"：
# 上一版盯的是 `releases/latest`。上游从来不发 GitHub Release（截至 2026-08-02
# 有 200 个 tag、**0 个 release**），所以那个端点恒 404，脚本走 `|| exit 0`
# 分支——每天"成功"地什么都不报。上游积到 531 个提交、版本从 0.23.x 走到
# v0.34.1，我们一次都没收到过通知。盯错了信号，不是机制坏了。
#
# 同理，这里**不再吞任何错误**：API 调不通就让整个 job 红，红了 GitHub 会发邮件。
# 静默的监测器比没有监测器更坏——它让人以为有人在看。
name: upstream-watch

on:
  schedule:
    - cron: '0 1 * * *' # daily 09:00 Asia/Shanghai
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

env:
  UPSTREAM_REPO: PM-Shawn/Abu-Cowork
  UPSTREAM_BRANCH: main
  BASE_BRANCH: main
  ISSUE_TITLE: 'upstream drift: 落后 abu-cowork'

jobs:
  check-upstream-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Compare with upstream and refresh the drift issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          upstream_owner="${UPSTREAM_REPO%%/*}"

          # base=我们的 main，head=上游的 main。
          # ahead_by = 上游有、我们没有的提交数，这才是"落后多少"。
          compare=$(gh api "repos/$REPO/compare/$BASE_BRANCH...$upstream_owner:$UPSTREAM_BRANCH")
          behind=$(echo "$compare" | jq -r '.ahead_by')
          ahead=$(echo "$compare" | jq -r '.behind_by')
          upstream_head=$(echo "$compare" | jq -r '.commits[-1].sha // ""' | cut -c1-7)

          # 上游只打 tag 不发 release，所以版本信号从 tag 取。
          latest_tag=$(gh api "repos/$UPSTREAM_REPO/tags?per_page=100" --paginate --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)

          compare_url="https://github.com/$REPO/compare/$BASE_BRANCH...$upstream_owner:${UPSTREAM_REPO#*/}:$UPSTREAM_BRANCH"

          echo "落后 $behind 个提交，领先 $ahead 个；上游最新 tag=$latest_tag"

          issue_number=$(gh issue list --repo "$REPO" --state open \
            --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // ""')

          if [ "$behind" -eq 0 ]; then
            if [ -n "$issue_number" ]; then
              gh issue close "$issue_number" --repo "$REPO" \
                --comment "已对齐上游 $UPSTREAM_BRANCH（落后 0 个提交），自动关闭。"
              echo "已对齐，关闭 issue #$issue_number。"
            else
              echo "已对齐上游，无事可做。"
            fi
            exit 0
          fi

          {
            echo "扶摇 \`$BASE_BRANCH\` 落后上游 [$UPSTREAM_REPO](https://github.com/$UPSTREAM_REPO) \`$UPSTREAM_BRANCH\` **$behind 个提交**（我方独有 $ahead 个）。"
            echo
            echo "- 上游最新 tag：\`${latest_tag:-未知}\`（上游不发 GitHub Release，只打 tag）"
            echo "- 上游 head：\`${upstream_head:-未知}\`"
            echo "- 逐条对比：$compare_url"
            echo "- 合并手册：\`UPSTREAM-SYNC.md\`"
            echo
            echo "> 本 issue 由 \`upstream-watch\` 每日重写，数字即当日实况；对齐后自动关闭。"
            echo "> 落后不等于要立刻合——扶摇走独立 1.x 线，合入按手册逐条评估。"
          } > issue_body.md

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --repo "$REPO" --body-file issue_body.md
            echo "已刷新 issue #$issue_number。"
          else
            gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --body-file issue_body.md --label upstream \
              || gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --body-file issue_body.md
            echo "已新建漂移追踪 issue。"
          fi
